<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>별별야구 : The Game</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #fff; color: #000;   /* 게임과 같은 낮 테마 — 밤은 JS 가 맞춘다 */
    font-family: ui-monospace, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden; touch-action: manipulation;
  }
  header {
    width: 100%; max-width: 900px; box-sizing: border-box;
    display: flex; align-items: baseline; gap: 12px; padding: 8px 14px 2px;
  }
  #title { font-weight: 700; font-size: 14px; }
  #hint { font-size: 11px; opacity: 0.55; flex: 1; }
  #store { font-size: 11px; color: inherit; opacity: 0.7; text-decoration: none; margin-right: 10px; }
  #lang {
    font: inherit; font-size: 11px; background: none; color: inherit;
    border: 1px solid rgba(26,26,20,0.35); border-radius: 5px;
    padding: 1px 8px; cursor: pointer;
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<header>
  <span id="title">별별야구 : The Game</span>
  <span id="hint"></span>
  <a id="store" href="https://apps.apple.com/kr/app/id6806802060" target="_blank" rel="noopener">App Store</a>
  <button id="lang">English</button>
</header>
<main><canvas id="game" width="680" height="300"></canvas></main>
<script type="module" src="app.js"></script>
</body>
</html>
